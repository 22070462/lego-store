<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — PLAYARENA</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            legoYellow: '#ffcf00',
            legoRed: '#d11013',
            legoOrange: '#fd8024',
            legoNavy: '#20214b',
            legoGrey: '#f8f8f8',
          },
          fontFamily: { sans: ['Montserrat', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    .header { background-color: #ffffff; height: 70px; display: flex; align-items: center; padding: 0 40px; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 1000; }
    .nav-link { text-decoration: none; color: #4b5563; font-weight: 600; font-size: 15px; position: relative; padding: 8px 0; transition: color 0.3s; }
    .nav-link::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background-color: #1a1a1a; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
    .search-bar { position: relative; background-color: #f3f4f6; border-radius: 8px; padding: 8px 12px 8px 36px; width: 280px; transition: all 0.3s; }
    .search-bar:focus-within { background-color: #fff; border-color: #d1d5db; width: 320px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .btn-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #4b5563; transition: all 0.2s; }
    .btn-icon:hover { background-color: #f3f4f6; color: #1a1a1a; }
    .badge { position: absolute; top: 4px; right: 4px; background-color: #f39c12; color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; border: 2px solid white; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">
  <header class="header">
    <div class="max-w-[1440px] w-full mx-auto flex justify-between items-center">
      <div class="flex items-center gap-12">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 bg-[#f39c12] rounded-md flex items-center justify-center text-white font-bold text-lg">B</div>
          <span class="text-xl font-extrabold tracking-tight">PLAYARENA</span>
        </a>
        <nav class="flex gap-7">
          <a href="products.html" class="nav-link">Shop</a>
          <a href="about.html" class="nav-link">Discover</a>
          <a href="help.html" class="nav-link">Help</a>
        </nav>
      </div>
      <div class="flex items-center gap-5">
        <div class="search-bar">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
          <input type="text" class="bg-transparent border-none outline-none text-sm w-full focus:ring-0" placeholder="Search...">
        </div>
        <div class="flex gap-2">
          <button class="btn-icon">♡</button>
          <a href="cart.html" class="relative">
            <button class="btn-icon">🛒</button>
            <span id="cartCount" class="badge">0</span>
          </a>
          <a href="profile.html" id="accountLink">
            <button id="accountIcon" class="btn-icon bg-legoYellow !text-white">👤</button>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative w-full h-[300px] bg-gradient-to-br from-legoOrange via-legoRed to-legoNavy overflow-hidden">
    <div class="absolute inset-0 bg-black/30"></div>
    <div class="absolute inset-0">
      <img src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=1920" alt="LEGO orders" class="w-full h-full object-cover opacity-30" />
    </div>
    <div class="relative z-10 h-full flex items-center px-12">
      <div class="text-white">
        <p class="text-xs font-semibold tracking-[0.2em] text-legoYellow mb-2 uppercase">My Orders</p>
        <h1 class="text-4xl md:text-5xl font-black">Order History</h1>
        <p class="text-lg text-gray-200 mt-2">Track and manage your purchases</p>
      </div>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 py-12">
    <div class="flex items-center gap-4 mb-8">
      <a href="profile.html" class="text-legoRed font-semibold hover:underline">← Back to Profile</a>
      <span class="text-gray-400">/</span>
      <span class="text-legoNavy font-bold">My Orders</span>
    </div>
    <p class="text-sm text-gray-600 mb-6">Click an order number to view item details and totals.</p>

    <div id="loading" class="text-gray-500 text-lg font-semibold">Loading...</div>
    <div id="empty" class="hidden bg-white rounded-2xl border-2 border-legoYellow p-16 text-center shadow-lg">
      <div class="text-6xl mb-4">📦</div>
      <p class="text-legoNavy font-bold text-xl mb-4">You have no orders yet.</p>
      <a href="products.html" class="inline-block bg-legoOrange text-white font-bold px-8 py-4 rounded-xl hover:bg-legoOrange/90 hover:scale-105 transition-transform">Shop Now</a>
    </div>
    <div id="tableWrap" class="hidden overflow-x-auto rounded-2xl border-2 border-legoYellow bg-white shadow-lg">
      <table class="w-full text-sm text-left">
        <thead class="text-xs uppercase text-gray-600 bg-legoYellow/10">
          <tr>
            <th class="px-6 py-4 font-bold">Order #</th>
            <th class="px-6 py-4 font-bold">Date</th>
            <th class="px-6 py-4 font-bold">Status</th>
            <th class="px-6 py-4 text-right font-bold">Total</th>
          </tr>
        </thead>
        <tbody id="orderRows" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>
  </main>

  <script>
    const API_BASE = "http://localhost:3000";

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        Authorization: "Bearer " + localStorage.getItem("token"),
      };
    }

    document.addEventListener("DOMContentLoaded", async function () {
      if (!localStorage.getItem("token")) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch(API_BASE + "/orders", { headers: authHeaders() });
        const list = await res.json();
        document.getElementById("loading").classList.add("hidden");

        if (!res.ok) {
          document.getElementById("empty").classList.remove("hidden");
          document.getElementById("empty").querySelector("p").textContent =
            list.message || "Unable to load orders.";
          return;
        }

        if (!list.length) {
          document.getElementById("empty").classList.remove("hidden");
          return;
        }

        document.getElementById("tableWrap").classList.remove("hidden");
        const tbody = document.getElementById("orderRows");
        list.forEach(function (o) {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-legoYellow/5 transition-colors";
          const dateStr = o.created_at
            ? new Date(o.created_at.replace(" ", "T")).toLocaleString("en-US")
            : "—";
          tr.innerHTML =
            '<td class="px-6 py-4">' +
            '<a href="order-detail.html?id=' +
            o.id +
            '" class="font-bold text-legoRed hover:underline">#' +
            o.id +
            "</a></td>" +
            '<td class="px-6 py-4 text-gray-600">' +
            dateStr +
            "</td>" +
            '<td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-xs font-bold ' + getStatusColor(o.status) + '">' + (o.status || "—") + "</span></td>" +
            '<td class="px-6 py-4 text-right font-bold text-legoNavy">$' +
            Number(o.total).toFixed(2) +
            "</td>";
          tbody.appendChild(tr);
        });
      } catch (e) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("empty").classList.remove("hidden");
      }
    });

    function getStatusColor(status) {
      const colors = {
        pending: "bg-yellow-100 text-yellow-800",
        processing: "bg-blue-100 text-blue-800",
        shipped: "bg-purple-100 text-purple-800",
        completed: "bg-green-100 text-green-800",
        cancelled: "bg-red-100 text-red-800",
        confirmed: "bg-green-100 text-green-800"
      };
      return colors[status] || "bg-gray-100 text-gray-800";
    }
  </script>
  <script src="cart-system.js"></script>
</body>
</html>
